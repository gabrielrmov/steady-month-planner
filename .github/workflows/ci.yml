name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install --no-audit --no-fund
      - name: Testes do servidor (PGlite)
        run: node --experimental-strip-types --test src/server/*.test.ts
      - name: Tipos
        run: |
          npx tsc --noEmit --pretty false > tsc.log 2>&1 || {
            msg=$(head -c 6000 tsc.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=tsc::$msg"
            exit 1
          }
      - name: Build (Cloudflare Workers)
        run: |
          npm run build > build-cf.log 2>&1 || {
            msg=$(tail -c 5000 build-cf.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=build-cloudflare::$msg"
            exit 1
          }
          ls .output/server | head -20
          test -f .output/server/wrangler.json || { echo "::error title=wrangler::wrangler.json não foi gerado"; exit 1; }
          cat .output/server/wrangler.json
          npx wrangler deploy --dry-run --config .output/server/wrangler.json > wrangler.log 2>&1 || {
            msg=$(tail -c 4000 wrangler.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=wrangler-dry-run::$msg"
            exit 1
          }
      - name: Build (servidor Node)
        run: |
          npm run build > build.log 2>&1 || {
            msg=$(tail -c 5000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=build::$msg"
            exit 1
          }
        env:
          DEPLOY_TARGET: node
      - name: Servidor sobe e responde
        run: |
          test -f .output/server/index.mjs
          DATABASE_URL=postgres://x:x@127.0.0.1:1/x SESSION_SECRET=0123456789012345678901234567890123456789 PORT=3111 node .output/server/index.mjs &
          sleep 4
          curl -sf http://127.0.0.1:3111/ | grep -qi finlist
          curl -sf http://127.0.0.1:3111/api/auth/session -o /dev/null -w '%{http_code}\n' || true
          curl -s -X POST http://127.0.0.1:3111/api/db -H 'content-type: application/json' -d '{}' -o /dev/null -w 'db sem sessão: %{http_code}\n'

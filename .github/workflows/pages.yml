name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      # Site de projeto: https://<usuario>.github.io/<repositorio>/
      # Com domínio próprio (ou repositório <usuario>.github.io), troque por "/".
      PAGES_BASE: "/${{ github.event.repository.name }}/"
      # Chaves PÚBLICAS do Supabase (publishable): já vão no JavaScript do navegador.
      # Nunca coloque aqui a service role nem segredos do Pluggy.
      SUPABASE_URL: "https://gwvksqmbredevjmgmqbk.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_cHEWGACwkEZoLzOvfsP2mg_b4T-bBVB"
      SUPABASE_PROJECT_ID: "gwvksqmbredevjmgmqbk"
      VITE_SUPABASE_URL: "https://gwvksqmbredevjmgmqbk.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_cHEWGACwkEZoLzOvfsP2mg_b4T-bBVB"
      VITE_SUPABASE_PROJECT_ID: "gwvksqmbredevjmgmqbk"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install --no-audit --no-fund

      - name: Build estático
        run: npm run build

      - name: Conferir a saída
        run: |
          ls -la dist/client
          test -f dist/client/index.html || (echo "index.html não foi gerado" && exit 1)

      - name: Fallback de rotas do app (SPA) em 404.html
        run: |
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/404.html
          else
            cp dist/client/index.html dist/client/404.html
          fi
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
